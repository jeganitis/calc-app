name: Claude PR Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "**.py"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review this PR for code quality, correctness, and safety.
            Pay special attention to: edge cases, error handling, eval() guards, and type hints.
            Post constructive feedback but do not approve/reject the PR.
