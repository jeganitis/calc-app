name: Claude Auto Documentation Generator

on:
  push:
    branches:
      - master
    paths:
      - "**.py"

permissions:
  contents: write
  pull-requests: read

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name  "claude-docs[bot]"
          git config user.email "claude-docs@users.noreply.github.com"

      - name: Generate Documentation with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Analyze calculator.py and generate:
            1. Updated README.md with features, requirements, and usage
            2. New DOCS.md with API documentation and limitations
            Commit and push both files to this repository.
