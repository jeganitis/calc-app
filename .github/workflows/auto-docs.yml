name: Claude Auto Documentation Generator

on:
  push:
    branches:
      - master
    paths:
      - "**.py"                    # only runs when Python files change

permissions:
  contents: write                 # needed to commit docs back to repo
  pull-requests: read
  id-token: write                 # needed for OIDC authentication

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git for doc commits
        run: |
          git config user.name  "claude-doc-agent[bot]"
          git config user.email "claude-doc-agent@users.noreply.github.com"

      - name: Run Claude Doc Generator Sub-Agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are a technical documentation agent for the calc-app project — a Python tkinter calculator.

            COMMIT: ${{ github.sha }}
            AUTHOR: ${{ github.actor }}

            YOUR TASK:
            1. Analyze the current calculator.py source code.

            2. Generate an UPDATED README.md that includes:
               - Project title and one-line description
               - Current Features section (list all supported operators)
               - Requirements (Python version, no extra packages)
               - How to Run section with the command
               - Project Structure section showing all files
               - "How It Works" section: 2-3 sentences on tkinter event loop and _evaluate() method
               - Footer: "Docs auto-generated by Claude"

            3. Generate a new DOCS.md file that includes:
               - Class: Calculator
                   Constructor parameters and their purpose
                   List of all methods with their purpose
                   List of all supported operators and their mapping to allowed_chars
               - Function: main() purpose and return value
               - Known Limitations section

            4. Use Claude Code's file operations to write both files and commit them.

            Keep documentation clear, accurate, and concise. Do not invent features.
            If a method has no docstring, infer its purpose from the implementation.
