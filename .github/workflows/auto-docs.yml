name: Claude Auto Documentation Generator

on:
  push:
    branches:
      - main
    paths:
      - "**.py"                    # only runs when Python files change

permissions:
  contents: write                 # needed to commit docs back to repo
  pull-requests: read

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git for doc commits
        run: |
          git config user.name  "claude-doc-agent[bot]"
          git config user.email "claude-doc-agent@users.noreply.github.com"

      - name: Run Claude Doc Generator Sub-Agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-haiku-4-5-20251001
          timeout_minutes: "8"
          allowed_tools: >
            mcp__github__get_file_contents,
            Bash(cat:*),
            Bash(git add:*),
            Bash(git commit:*),
            Bash(git push:*)
          prompt: |
            You are a technical documentation sub-agent for the
            calc-app project — a Python tkinter calculator.

            COMMIT: ${{ github.sha }}
            AUTHOR: ${{ github.actor }}

            YOUR TASK:
            1. Read the current calculator.py using get_file_contents
            2. Read the current README.md using get_file_contents

            3. Generate an UPDATED README.md that includes:
               - Project title and one-line description
               - Current Features section (list all supported operators)
               - Requirements (Python version, no extra packages)
               - How to Run section with the command
               - Project Structure section showing all files
               - a "How It Works" section: 2-3 sentences on the
                 tkinter event loop and the _evaluate() method
               - Footer: "Docs auto-generated by Claude on [today's date]"

            4. Generate a new file DOCS.md that includes:
               - Class: Calculator
                   Constructor parameters and what they do
                   List of all methods with their purpose
                   List of all supported operators and how they
                   map to the allowed_chars guard in _evaluate()
               - Function: main()
                   Purpose and what it returns
               - Known Limitations section:
                   What the allowed_chars guard prevents
                   Any known edge cases

            5. Write README.md to disk using:
                 cat > README.md << 'DOCEOF'
                 [generated content]
                 DOCEOF

            6. Write DOCS.md to disk using:
                 cat > DOCS.md << 'DOCEOF'
                 [generated content]
                 DOCEOF

            7. Commit and push both files:
                 git add README.md DOCS.md
                 git commit -m "docs: auto-update for ${{ github.sha }}"
                 git push

            Keep writing clear, accurate, and concise. Do not invent
            features that are not in the code. If a method has no
            docstring, infer its purpose from the implementation.
