name: Claude Auto Documentation Generator

on:
  push:
    branches:
      - master
    paths:
      - "**.py"

permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create DOCS.md
        run: |
          cat > DOCS.md << 'EOF'
          # Calculator Application Documentation

          ## Class: Calculator

          ### Constructor
          - **Parameters:** `root: tk.Tk`
          - **Purpose:** Initializes the calculator with a tkinter window

          ### Methods
          - `_build_display()` - Creates the text display at the top
          - `_build_buttons()` - Creates the calculator button grid
          - `_on_button(label)` - Handles button press events
          - `_evaluate()` - Evaluates the expression and shows the result

          ## Supported Operators

          | Operator | Symbol | Example |
          |----------|--------|---------|
          | Addition | + | 5 + 3 = 8 |
          | Subtraction | - | 5 - 3 = 2 |
          | Multiplication | * | 5 * 3 = 15 |
          | Division | / | 6 / 3 = 2 |

          All operators are validated through the `allowed_chars` guard in the `_evaluate()` method.

          ## Function: main()

          **Purpose:** Initializes and runs the calculator application

          **Returns:** None (blocking; runs until user closes window)

          ## Known Limitations

          - The `eval()` function is used with a character whitelist guard
          - Only supports numeric operators (+, -, *, /)
          - Division by zero shows "Error: Div/0"
          - Invalid expressions show "Error"
          - No support for parentheses or complex expressions

          ---

          _Documentation auto-generated_
          EOF

      - name: Update README.md
        run: |
          cat > README.md << 'EOF'
          # Calculator App

          A simple desktop calculator built with Python and tkinter.

          ## Features (Phase 2)
          - Addition (+)
          - Subtraction (-)
          - Multiplication (*)
          - Division (/)

          ## Requirements
          - Python 3.8 or higher
          - No external packages needed (tkinter is built into Python)

          ## Run

          ```bash
          python calculator.py
          ```

          ## How It Works

          The calculator uses a tkinter event loop to handle button presses. When the user clicks "=", the `_evaluate()` method parses the expression and uses `eval()` with a character whitelist guard to safely compute the result. Results are displayed in the text entry field, and invalid inputs show error messages.

          ## Project Structure

          ```
          calc-app/
          ├── calculator.py   ← Main application
          ├── README.md       ← This file
          ├── DOCS.md         ← API documentation
          └── .gitignore      ← Git configuration
          ```

          ---

          Docs auto-generated by Claude
          EOF

      - name: Commit and push documentation
        run: |
          git config user.name  "claude-docs[bot]"
          git config user.email "claude-docs@users.noreply.github.com"
          git add README.md DOCS.md
          git commit -m "docs: auto-update documentation" || echo "No changes to commit"
          git push origin master || echo "Nothing to push"
